name: Quality checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentlens
          POSTGRES_PASSWORD: agentlens
          POSTGRES_DB: agentlens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentlens -d agentlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENTLENS_DATABASE_URL: postgresql+psycopg://agentlens:agentlens@localhost:5432/agentlens
      AGENTLENS_REDIS_URL: redis://localhost:6379/0
      AGENTLENS_PROJECT_API_KEY: ci-test-key-1234567890
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: agentlens migrate upgrade
      - run: python -m pytest

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
