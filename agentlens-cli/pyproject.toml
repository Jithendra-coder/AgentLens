[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlens"
version = "0.2.0"
description = "Provider-independent RAG observability, Lighthouse performance audit, and universal codebase scanner."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1,<4"
]
test = [
    "pytest>=7.0"
]

[project.scripts]
agentlens = "agentlens_core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentlens_core*"]
